services:
  db:
    image: pgvector/pgvector:pg16
    container_name: discovery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discovery}
      POSTGRES_DB: ${POSTGRES_DB:-discovery}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - discovery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discovery} -d ${POSTGRES_DB:-discovery}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  discovery_pgdata:
